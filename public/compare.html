<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compare - SpotGo</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="Mystyle.css">
  </head>
  <body>
    <nav>
      <div class="logo">SpotGo</div>
      <div class="links">
        <a href="index.html">Home</a>
        <a href="map.html">Map</a>
        <a href="compare.html">Compare</a>
        <a href="events.html">Events</a>

    <main>
      <h1 class="page-title">Compare workspaces</h1>
      <p class="area">Choose up to 3 workspaces to compare them side by side. The best value in each row is highlighted.</p>

      <div class="compare-pickers">
        <select class="compare-select" aria-label="First workspace"></select>
        <select class="compare-select" aria-label="Second workspace"></select>
        <select class="compare-select" aria-label="Third workspace"></select>
      </div>

      <div class="compare-wrap">
        <table class="compare-table" id="compare-table"></table>
      </div>
    </main>

    <script src="i18n.js"></script>
    <script src="ui.js"></script>
    <script src="geo.js"></script>
