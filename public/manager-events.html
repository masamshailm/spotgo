<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manager Events - SpotGo</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="Mystyle.css">
  </head>
  <body>
    <div class="dash">
      <aside class="dash-side">
        <div class="logo">SpotGo</div>
        <div class="area">Owner Panel</div>

        <a class="side-link" href="manager.html">Dashboard</a>
        <a class="side-link" href="manager-workspaces.html">My Workspaces</a>
        <a class="side-link" href="manager-availability.html">Availability</a>
        <a class="side-link active" href="manager-events.html">Events</a>
        <a class="side-link" href="manager-earnings.html">Earnings</a>
        <a class="side-link" href="manager-reviews.html">Reviews</a>
        <a class="side-link logout" href="#" id="logout-link">Log out</a>
      </aside>

      <div class="dash-main">
        <h1>Events</h1>
        <p class="area">Create workshops or study sessions in your workspaces and see who registered.</p>

        <p id="page-message" class="page-message"></p>

        <details class="dash-panel add-box" open>
          <summary><b>Create an event</b></summary>
          <form id="event-form">
            <div class="form-grid">
              <label>Workspace <select name="workspaceId" id="ws-select" required></select></label>
              <label>Title <input name="title" required maxlength="100"></label>
              <label>Title in Arabic (optional) <input name="titleAr" maxlength="100" dir="rtl"></label>
              <label>Date <input name="date" type="date" id="event-date" required></label>
              <label>Start hour (8 to 22) <input name="startHour" type="number" min="8" max="22" value="12" required></label>
              <label>Duration (hours) <input name="duration" type="number" min="1" max="8" value="2" required></label>
              <label>Price (EGP, 0 = free) <input name="price" type="number" min="0" max="10000" value="0" required></label>
              <label>Capacity <input name="capacity" type="number" min="1" max="500" value="20" required></label>
            </div>
            <label class="full">Description <textarea name="description" rows="2" maxlength="500"></textarea></label>
            <label class="full">Description in Arabic (optional) <textarea name="descriptionAr" rows="2" maxlength="500" dir="rtl"></textarea></label>
            <button class="book-btn" type="submit">Create event</button>
          </form>
        </details>

        <div class="dash-panel spaced">
          <h2>My events</h2>
          <div id="list"><p class="area">Loading...</p></div>
        </div>
      </div>
    </div>

    <script src="i18n.js"></script>
    <script src="ui.js"></script>
    <script src="notif.js"></script>
    <script src="dash-common.js"></script>
    <script src="manager-events.js"></script>
  </body>
</html>
